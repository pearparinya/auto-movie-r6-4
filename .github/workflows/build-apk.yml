name: R6.6 Release Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/-----BEGIN CERTIFICATE-----/d;/-----END CERTIFICATE-----/d' \
            | tr -d '\r\n' \
            | base64 --decode > "$RUNNER_TEMP/auto-movie-release.jks"

      - name: Verify keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/auto-movie-release.jks" \
            -storepass "$STORE_PASSWORD" > /dev/null

          echo "Release keystore verified."

      - name: Build release APK
        run: gradle assembleRelease

      - name: Sign release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/AUTO-MOVIE-R6.6-release.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/auto-movie-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

      - name: Verify signed APK
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "app/build/outputs/apk/release/AUTO-MOVIE-R6.6-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-MOVIE-R6.6-SIGNED-APK
          path: app/build/outputs/apk/release/AUTO-MOVIE-R6.6-release.apk
          if-no-files-found: error
